  /workers:
    get:
      tags: [Workers]
      summary: List workers (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Q"
        - name: keahlian
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit20"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WorkerListResponse" }
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
