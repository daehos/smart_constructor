          items: { $ref: "#/components/schemas/AttendanceCalendarDay" }

    PayrollComponent:
      type: object
      additionalProperties: false
      required: [name, type, amount]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [earning, deduction] }
        amount: { type: number, minimum: 0 }

    PayrollCreateRequest:
      type: object
      additionalProperties: false
      required: [user, period, gajiPokok]
      properties:
        user: { $ref: "#/components/schemas/ObjectId" }
        period:
          type: object
          additionalProperties: false
          required: [year, month]
          properties:
            year: { type: integer, minimum: 2000 }
            month: { type: integer, minimum: 1, maximum: 12 }
        gajiPokok: { type: number, minimum: 0 }
        components:
          type: array
          items: { $ref: "#/components/schemas/PayrollComponent" }
          default: []

    PayrollUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        gajiPokok: { type: number, minimum: 0 }
        components:
          type: array
          items: { $ref: "#/components/schemas/PayrollComponent" }

    Payroll:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        user: { $ref: "#/components/schemas/ObjectId" }
        period:
          type: object
          additionalProperties: false
          properties:
            year: { type: integer }
            month: { type: integer }
          required: [year, month]
        gajiPokok: { type: number }
        components:
          type: array
          items: { $ref: "#/components/schemas/PayrollComponent" }
        totalEarning: { type: number }
        totalDeduction: { type: number }
        netSalary: { type: number }
        status: { type: string, enum: [draft, paid] }
        paidAt: { type: string, format: date-time, nullable: true }
        paidBy: { $ref: "#/components/schemas/ObjectId", nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserMini:
      type: object
      additionalProperties: false
      required: [_id, nama, email]
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        nama: { type: string }
        email: { type: string, format: email }

    PayrollPopulated:
      allOf:
        - $ref: "#/components/schemas/Payroll"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/UserMini" }
            paidBy:
              $ref: "#/components/schemas/UserMini"
              nullable: true

    PayrollListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PayrollPopulated" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

    ActivityLog:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        actor:
          allOf:
            - $ref: "#/components/schemas/UserMini"
        action: { type: string }
        resource: { type: string, nullable: true }
        resourceId: { $ref: "#/components/schemas/ObjectId", nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ActivityLogListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ActivityLog" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

