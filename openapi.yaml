        payment: { $ref: "#/components/schemas/OrderPayment" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [_id, orderNumber, vendor, buyer, items, pesan, status, shipping, payment]

