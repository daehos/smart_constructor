components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Use Authorization: Bearer <token>"

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    Q:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit20:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error401:
      description: Unauthorized (missing/invalid/expired JWT or invalid credentials)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error404:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error422:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Error500:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ObjectId:
      type: string
      description: MongoDB ObjectId as hex string
      pattern: "^[a-fA-F0-9]{24}$"

    SuccessEnvelope:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [success]
        data:
          description: Endpoint-specific response payload
      required: [status, data]

    ErrorEnvelope:
      type: object
      description: Default error shape from `middlewares/error.middleware.js`
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
      required: [success, message]

    AuthControllerValidationError:
      type: object
      description: AuthController may return this 400 shape on JSON.parse(error.message) errors
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        data: {}
      required: [status, message, data]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [nama, email, gender, phoneNumber, tanggalLahir, password]
      properties:
        nama: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role:
          type: string
          enum: [hr, admin_finance, admin_pengadaan, owner, pekerja]
          default: pekerja
        gender:
          type: string
          enum: [male, female]
        phoneNumber: { type: string, minLength: 7, maxLength: 15 }
        tanggalLahir:
          type: string
          format: date
          description: Date string, e.g. 1988-12-25
        kategoriSpesialisasi:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 1 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    LoginOtpQueuedResponse:
      type: object
      additionalProperties: false
      required: [message, email]
      properties:
        message: { type: string }
        email: { type: string, format: email }

    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token]
      properties:
        access_token:
          type: string
          description: JWT access token

    UserProfile:
      type: object
      additionalProperties: false
      properties:
        nama: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [hr, admin_finance, admin_pengadaan, owner, pekerja]
        phoneNumber: { type: string }
        gender: { type: string, enum: [male, female] }
        tanggalLahir:
          type: string
          format: date-time
        kategoriSpesialisasi:
          type: string
          nullable: true
      required: [nama, email, role, phoneNumber, gender, tanggalLahir]

    VendorCreateRequest:
      type: object
      additionalProperties: false
      required: [telepon, email, namaPerusahaan, alamatPerusahaan, kategoriSpesialisasi]
      properties:
        namaBrand: { type: string, nullable: true }
        telepon: { type: string, minLength: 7 }
        email: { type: string, format: email }
        website: { type: string, default: "" }
        namaPerusahaan: { type: string, minLength: 1 }
        alamatPerusahaan: { type: string, minLength: 1 }
        kategoriSpesialisasi: { type: string, minLength: 1 }
        subKategori:
          type: array
          items: { type: string }
          default: []
        photoUrl: { type: string, format: uri, nullable: true }
        profilDokumenUrl: { type: string, format: uri, nullable: true }
        riwayatHargaMaterial:
          type: array
          items: { $ref: "#/components/schemas/MaterialPriceHistoryCreateRequest" }
          default: []

    VendorUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/VendorCreateRequest"
      description: Partial update (all fields optional)

    VendorListItem:
      type: object
      additionalProperties: false
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        vendorCode: { type: string }
        namaBrand: { type: string, nullable: true }
        namaPerusahaan: { type: string }
        kategoriSpesialisasi: { type: string }
        subKategori:
          type: array
          items: { type: string }
        email: { type: string, format: email }
        alamatPerusahaan: { type: string }
        photoUrl: { type: string, nullable: true }
      required: [_id, vendorCode, namaPerusahaan, kategoriSpesialisasi, subKategori, email, alamatPerusahaan]

    VendorListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/VendorListItem" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

    MaterialRef:
      type: object
      additionalProperties: false
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        nama: { type: string }
        kategori: { type: string }
        satuan: { type: string }
      required: [_id, nama, kategori, satuan]

    ProjectRef:
      type: object
      additionalProperties: false
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        nama: { type: string }
        lokasi: { type: string }
      required: [_id, nama, lokasi]

    MaterialPriceHistoryCreateRequest:
      type: object
      additionalProperties: false
      required: [namaMaterial, hargaTerakhir, namaProyek]
      properties:
        material:
          $ref: "#/components/schemas/ObjectId"
          nullable: true
        namaMaterial: { type: string, minLength: 1 }
        hargaTerakhir: { type: number, minimum: 0 }
        satuanHarga: { type: string, default: "/kg" }
        proyek:
          $ref: "#/components/schemas/ObjectId"
          nullable: true
        namaProyek: { type: string, minLength: 1 }

    MaterialPriceHistory:
      allOf:
        - $ref: "#/components/schemas/MaterialPriceHistoryCreateRequest"
        - type: object
          properties:
            _id: { $ref: "#/components/schemas/ObjectId" }

    Vendor:
      type: object
      description: Vendor document (may include many fields, including timestamps)
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        vendorCode: { type: string }
        namaBrand: { type: string, nullable: true }
        telepon: { type: string }
        email: { type: string, format: email }
        website: { type: string }
        namaPerusahaan: { type: string }
        alamatPerusahaan: { type: string }
        kategoriSpesialisasi: { type: string }
        subKategori:
          type: array
          items: { type: string }
        riwayatHargaMaterial:
          type: array
          items: { $ref: "#/components/schemas/MaterialPriceHistory" }
        profilDokumenUrl: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }

    VendorPopulated:
      allOf:
        - $ref: "#/components/schemas/Vendor"
        - type: object
          properties:
            riwayatHargaMaterial:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MaterialPriceHistory"
                  - type: object
                    properties:
                      material:
                        $ref: "#/components/schemas/MaterialRef"
                        nullable: true
                      proyek:
                        $ref: "#/components/schemas/ProjectRef"
                        nullable: true

    VendorMaterialHistoryResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MaterialPriceHistory" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

    VendorAudit:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        vendor: { $ref: "#/components/schemas/ObjectId" }
        action: { type: string, enum: [CREATE, UPDATE, DELETE] }
        changes:
          type: object
          additionalProperties: true
          properties:
            before:
              type: object
              additionalProperties: true
              nullable: true
            after:
              type: object
              additionalProperties: true
              nullable: true
        changedBy:
          description: Populated user
          type: object
          additionalProperties: false
          properties:
            _id: { $ref: "#/components/schemas/ObjectId" }
            nama: { type: string }
            email: { type: string, format: email }
          required: [_id, nama, email]
        changedAt: { type: string, format: date-time }

    VendorAuditListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/VendorAudit" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [nama]
      properties:
        nama: { type: string, minLength: 1 }
        lokasi: { type: string, default: "" }

    ProjectUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ProjectCreateRequest"
      description: Partial update (all fields optional)

    Project:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        nama: { type: string }
        lokasi: { type: string }
