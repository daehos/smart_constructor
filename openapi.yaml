        limit: { type: integer, minimum: 1 }

    ClockEventRequest:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    AttendanceClockEvent:
      type: object
      additionalProperties: false
      properties:
        at: { type: string, format: date-time, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        withinRadius: { type: boolean, nullable: true }

    Attendance:
      type: object
      additionalProperties: true
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        user: { $ref: "#/components/schemas/ObjectId" }
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        clockIn: { $ref: "#/components/schemas/AttendanceClockEvent" }
        clockOut: { $ref: "#/components/schemas/AttendanceClockEvent" }
        location: { type: string }
        status: { type: string, enum: [present, absent, leave] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttendanceAbsentDefault:
      type: object
      additionalProperties: false
      required: [user, date, clockIn, clockOut, status]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: string
              description: May be returned as stringified ObjectId
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        clockIn:
          $ref: "#/components/schemas/AttendanceClockEvent"
          nullable: true
        clockOut:
          $ref: "#/components/schemas/AttendanceClockEvent"
          nullable: true
        status: { type: string, enum: [absent] }

    ClockEventResponse:
      type: object
      additionalProperties: false
      required: [withinRadius, attendance]
      properties:
        withinRadius: { type: boolean }
        attendance: { $ref: "#/components/schemas/Attendance" }

    AttendanceListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Attendance" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }

    AttendanceCalendarDay:
      type: object
      additionalProperties: false
      required: [date, day, dayLabel, status, clockIn, clockOut]
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        day: { type: integer, minimum: 1, maximum: 31 }
        dayLabel: { type: string }
        status: { type: string, enum: [present, absent, leave] }
        clockIn: { type: string, format: date-time, nullable: true }
        clockOut: { type: string, format: date-time, nullable: true }

    AttendanceCalendarResponse:
      type: object
      additionalProperties: false
      required: [month, days]
      properties:
        month:
